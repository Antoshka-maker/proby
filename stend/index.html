<!doctype html><meta charset="utf-8"><title>Стенд</title>
<html><body style="margin:0;background:#dfe3e8"><script src="three.min.js"></script><script>
const Q=new URLSearchParams(location.search);const view=Q.get('v')||'a';
const W=1600,H=1000;const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1.5);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xd9dee4);s.fog=new THREE.Fog(0xd9dee4,22,45);
const NAVY=0x0f2747,OR=0xff6a13,WH=0xf4f5f7,GR=0x9aa3ad,WOOD=0x6b4a32;
function mat(c,o={}){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:.02},o))}
function box(w,h,d,x,y,z,m,sh=true){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof m=='number'?mat(m):m);b.position.set(x,y,z);b.castShadow=sh;b.receiveShadow=true;s.add(b);return b}
function label(txt,w,h,opt={}){const c=document.createElement('canvas');c.width=opt.cw||1024;c.height=Math.round(c.width*h/w);const g=c.getContext('2d');if(opt.bg){g.fillStyle=opt.bg;g.fillRect(0,0,c.width,c.height)}if(opt.draw)opt.draw(g,c.width,c.height);g.fillStyle=opt.color||'#fff';g.font=(opt.weight||'700')+' '+(opt.size||120)+'px Arial';g.textAlign=opt.align||'center';g.textBaseline='middle';const lines=txt.split('\n');lines.forEach((l,i)=>g.fillText(l,opt.align=='left'?(opt.px||60):c.width/2,c.height/2+(i-(lines.length-1)/2)*(opt.size||120)*1.15+(opt.dy||0)));const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
// hall floor
const fl=new THREE.Mesh(new THREE.PlaneGeometry(80,80),mat(0xc9ced5,{roughness:.9}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;s.add(fl);
// stand: x 0..7.5 (front edge z=3 open, right edge x=7.5 open), back wall z=0, left wall x=0
const L=7.5,D=3,Hh=3.6;
box(L,.1,D,L/2,.05,D/2,mat(0x1a2433,{roughness:.6}));           // podium
box(L-.02,.012,.9,L/2,.106,D-.5,mat(OR,{roughness:.5,emissive:OR,emissiveIntensity:.15}),false); // route strip on floor front
// back wall with lightbox graphic
box(L,Hh,.12,L/2,Hh/2+.1,.06,NAVY);
const kv=label('',L-1.9,2.2,{cw:2048,bg:'#12305a',draw:(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#0f2747');gr.addColorStop(1,'#1d4f8f');g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.10)';g.lineWidth=2;for(let i=0;i<24;i++){g.beginPath();g.moveTo(i*w/12-200,0);g.lineTo(i*w/12-h-200,h);g.stroke()}g.strokeStyle='#ff6a13';g.lineWidth=14;g.lineCap='round';g.beginPath();g.moveTo(80,h*.78);g.bezierCurveTo(w*.25,h*.2,w*.45,h*.95,w*.62,h*.5);g.bezierCurveTo(w*.72,h*.25,w*.85,h*.35,w-90,h*.22);g.stroke();[[80,h*.78],[w*.62,h*.5],[w-90,h*.22]].forEach(p=>{g.fillStyle='#fff';g.beginPath();g.arc(p[0],p[1],26,0,7);g.fill();g.fillStyle='#ff6a13';g.beginPath();g.arc(p[0],p[1],13,0,7);g.fill()});g.fillStyle='#fff';g.font='800 150px Arial';g.textAlign='left';g.fillText('ВАШ БРЕНД',110,210);g.font='400 62px Arial';g.fillStyle='rgba(255,255,255,.85)';g.fillText('Маршрут от двери до двери',114,300)}});
const lb=new THREE.Mesh(new THREE.PlaneGeometry(L-1.9,2.2),new THREE.MeshStandardMaterial({map:kv,emissive:0xffffff,emissiveMap:kv,emissiveIntensity:.55,roughness:.6}));lb.position.set(1.7+(L-1.9)/2,1.95,.125);s.add(lb);
// left wall + storage room in back-left corner (1.5 x 1.3)
box(.12,Hh,D,.06,Hh/2+.1,D/2,NAVY);
box(1.5,2.6,.08,.87,1.4,1.34,WH);box(.08,2.6,1.3,1.6,1.4,.7,WH);
box(.75,2.05,.03,.75,1.13,1.39,mat(0xe3e6ea));box(.03,.14,.03,1.02,1.1,1.42,GR);
const tt=label('ПЕРЕГОВОРЫ · СКЛАД',1.4,.3,{cw:1024,size:74,color:'#0f2747',weight:'700'});const tm=new THREE.Mesh(new THREE.PlaneGeometry(1.3,.28),new THREE.MeshBasicMaterial({map:tt,transparent:true}));tm.position.set(.87,2.4,1.385);s.add(tm);
// fascia portal: beam over the open front and open right side, with corner column
box(.18,Hh,.18,L-.09,Hh/2+.1,D-.09,WH);
box(L,.55,.16,L/2,Hh-.18,D-.08,WH);box(.16,.55,D,L-.08,Hh-.18,D/2,WH);
const ft=label('ВАШ БРЕНД',3.2,.45,{cw:1536,size:150,color:'#0f2747',weight:'800'});
const f1=new THREE.Mesh(new THREE.PlaneGeometry(3.0,.42),new THREE.MeshBasicMaterial({map:ft,transparent:true}));f1.position.set(2.2,Hh-.18,D+.005);s.add(f1);
const f2=new THREE.Mesh(new THREE.PlaneGeometry(2.4,.34),new THREE.MeshBasicMaterial({map:ft,transparent:true}));f2.position.set(L+.005,Hh-.18,D/2);f2.rotation.y=Math.PI/2;s.add(f2);
box(L,.05,.05,L/2,Hh-.47,D+.0,mat(OR,{emissive:OR,emissiveIntensity:.9}),false);box(.05,.05,D,L+.0,Hh-.47,D/2,mat(OR,{emissive:OR,emissiveIntensity:.9}),false);
// reception desk at open corner (curved feel: two boxes) 
box(1.5,1.05,.5,L-1.25,.63,D-.55,WH);box(1.5,.04,.56,L-1.25,1.17,D-.55,mat(WOOD,{roughness:.5}));
box(1.42,.5,.02,L-1.25,.6,D-.29,mat(OR,{emissive:OR,emissiveIntensity:.25}),false);
// screen totem near left front
box(.7,2.1,.14,2.2,1.15,2.55,mat(0x10151c));const sc=label('ОНЛАЙН-\nТРЕКИНГ',.6,1.2,{cw:512,size:64,bg:'#16365f',color:'#fff'});const sm=new THREE.Mesh(new THREE.PlaneGeometry(.58,1.15),new THREE.MeshBasicMaterial({map:sc}));sm.position.set(2.2,1.45,2.625);s.add(sm);
// meeting zone: round table + 4 chairs, centre
function cyl(rt,rb,h,x,y,z,m){const c=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,48),typeof m=='number'?mat(m):m);c.position.set(x,y,z);c.castShadow=true;c.receiveShadow=true;s.add(c);return c}
const tx=4.1,tz=1.35;cyl(.45,.45,.04,tx,.86,tz,mat(WOOD,{roughness:.45}));cyl(.04,.04,.74,tx,.47,tz,GR);cyl(.25,.28,.03,tx,.115,tz,GR);
[[.75,0],[-.75,0],[0,.75],[0,-.72]].forEach(p=>{cyl(.2,.2,.05,tx+p[0],.56,tz+p[1],OR);cyl(.025,.025,.44,tx+p[0],.33,tz+p[1],GR);cyl(.16,.18,.02,tx+p[0],.11,tz+p[1],GR)});
// brochure stand + plant
box(.35,1.3,.25,6.9,.75,.4,WH);cyl(.22,.17,.4,.55,.3,2.5,WH);const pl=new THREE.Mesh(new THREE.SphereGeometry(.42,24,16),mat(0x2f6b45,{roughness:.95}));pl.position.set(.55,.95,2.5);pl.scale.y=1.4;pl.castShadow=true;s.add(pl);
// people silhouettes for scale
function man(x,z,c){cyl(.17,.13,1.25,x,.73,z,mat(c,{roughness:.9}));const h=new THREE.Mesh(new THREE.SphereGeometry(.12,20,14),mat(0xd8b79a));h.position.set(x,1.5,z);h.castShadow=true;s.add(h)}
man(L-1.3,D-1.05,0x22303f);man(5.6,3.9,0x8a8f96);man(3.1,2.2,0x3b4654);
// lights
s.add(new THREE.HemisphereLight(0xffffff,0xb7bcc4,.75));const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(9,12,10);dl.castShadow=true;dl.shadow.mapSize.set(4096,4096);Object.assign(dl.shadow.camera,{left:-10,right:10,top:10,bottom:-10});dl.shadow.bias=-.0004;s.add(dl);
[1.5,3.75,6].forEach(x=>{const sp=new THREE.SpotLight(0xfff1dc,.55,7,.7,.6);sp.position.set(x,Hh-.2,2.4);sp.target.position.set(x,0,1.2);s.add(sp);s.add(sp.target)});
let cam;if(view=='top'){cam=new THREE.OrthographicCamera(-6.4,6.4,4,-4,.1,50);cam.position.set(L/2,20,D/2);cam.up.set(0,0,-1);cam.lookAt(L/2,0,D/2);s.fog=null}
else{cam=new THREE.PerspectiveCamera(38,W/H,.1,100);if(view=='a'){cam.position.set(12.5,3.4,9.2);cam.lookAt(3.9,1.5,1.2)}else{cam.position.set(2.2,2.5,11);cam.lookAt(3.9,1.6,1)}}
r.render(s,cam);
</script></body></html>
